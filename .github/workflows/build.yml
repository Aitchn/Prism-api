name: Build API

on:
  push:
    branches: [main, '0.9.62']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enforce API-only repository contents
        shell: bash
        run: |
          allowed='^(src/(main|test)/java/com/aitchn/prism/api/.*\.java|\.github/workflows/build\.yml|\.gitattributes|\.gitignore|LICENSE|README\.md|build\.gradle\.kts|settings\.gradle\.kts|gradle/wrapper/gradle-wrapper\.(jar|properties)|gradlew(\.bat)?)$'
          unexpected=$(git ls-files | grep -Ev "$allowed" || true)
          if [[ -n "$unexpected" ]]; then
            printf 'Files outside the public API allowlist:\n%s\n' "$unexpected"
            exit 1
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Build public API
        run: bash ./gradlew clean build --no-daemon --console=plain
      - name: Upload API JARs
        uses: actions/upload-artifact@v4
        with:
          name: Prism-api-${{ github.ref_name }}
          path: build/libs/Prism-api-*.jar
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Prism-api-${{ github.ref_name }}
          path: dist
      - name: Publish tagged API JARs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if [[ "$TAG" == *-* ]]; then
            gh release create "$TAG" dist/*.jar --verify-tag --title "Prism API $TAG" --generate-notes --prerelease
          else
            gh release create "$TAG" dist/*.jar --verify-tag --title "Prism API $TAG" --generate-notes
          fi
